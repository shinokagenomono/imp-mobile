<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c0a">
<title>IMP – úkoly</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg1: #2a1f18; --bg2: #140c0a; --panel: #1b1210; --line: #7a5d1a; --gold: #ffd54f; --gold-dim: #b8902f;
    --text: #f3e3b0; --dim: #a8987a; --red: #a8261a; --ok: #6fbf73;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg2); color: var(--text);
    font: 17px/1.4 Georgia, "Times New Roman", serif; }
  body { background: linear-gradient(180deg, var(--bg1), var(--bg2) 60%) fixed; padding-bottom: 96px; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: rgba(20,12,10,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  header img { width: 36px; height: 36px; border-radius: 8px; }
  header h1 { flex: 1; margin: 0; font-size: 19px; color: var(--gold); letter-spacing: .5px; }
  header .sync { font-size: 12px; color: var(--dim); text-align: right; }
  button { font: inherit; color: var(--gold); background: transparent; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
  button:active { background: rgba(255,213,79,.12); }
  button.icon { padding: 0; width: 44px; }
  button.primary { background: var(--gold); color: #1b1210; border-color: var(--gold); font-weight: bold; }
  button.danger { color: #ff8a80; border-color: #6b2a24; }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  h2 { margin: 22px 0 8px; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-dim); font-weight: normal;
    display: flex; align-items: center; justify-content: space-between; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 4px 6px 4px 14px; min-height: 52px; border-top: 1px solid #3a2a1c; }
  .row:first-child { border-top: 0; }
  .row .label { flex: 1; padding: 10px 0; word-break: break-word; }
  .row.note { cursor: pointer; }
  .row.note .label::before { content: "•"; color: var(--gold-dim); margin-right: 10px; }
  .row .meta { color: var(--dim); font-size: 12px; }
  .row.done .label { color: var(--dim); text-decoration: line-through; }
  input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; flex: none; margin: 0;
    border: 2px solid var(--gold); border-radius: 7px; background: transparent; }
  input[type=checkbox]:checked { background: var(--gold); box-shadow: inset 0 0 0 4px var(--panel); }
  .empty { padding: 16px; color: var(--dim); }
  .divider { height: 1px; margin: 18px 40px 0; background: linear-gradient(90deg, transparent, var(--red), transparent); position: relative; }
  .divider::after { content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; background: var(--red); transform: translateX(-50%) rotate(45deg); }
  .addbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: rgba(20,12,10,.96); border-top: 1px solid var(--line); }
  .addbar form { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text], textarea { font: inherit; color: var(--text); background: #0d0907; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; width: 100%; min-height: 44px; }
  input[type=text]:focus, textarea:focus { outline: 0; border-color: var(--gold); }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  .banner { margin: 12px 0; padding: 10px 14px; border-radius: 10px; border: 1px solid #6b2a24; background: #2a1210; color: #ffb4a8; }
  .banner.info { border-color: var(--line); background: #241a10; color: var(--text); }
  #login { text-align: center; padding: 60px 16px; }
  #login img { width: 120px; border-radius: 24px; }
  #login p { color: var(--dim); }
  #editor { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; background: var(--bg2); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
  #editor.open { display: flex; }
  #editor textarea { flex: 1; resize: none; line-height: 1.5; }
  #editor .bar { display: flex; gap: 8px; }
  #editor .bar .spacer { flex: 1; }
  [hidden] { display: none !important; }
  .row.task { cursor: pointer; }
  .row .meta { display: block; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line); margin-right: 6px; color: var(--dim); }
  .badge.high { color: #ffab91; border-color: #8a3a2a; }
  .badge.low { color: #9fb7a0; border-color: #3f5a41; }
  .badge.proj { color: var(--gold-dim); }
  select { font: inherit; color: var(--text); background: #0d0907; border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; min-height: 44px; width: 100%; }
  #editor { overflow-y: auto; }
  #editor .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #editor label.cap { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-dim); margin: 2px 0 4px; }
  #editor textarea { flex: none; min-height: 110px; }
  #ed-subs .row { padding-left: 8px; min-height: 44px; }
  @media (max-width: 420px) { #editor .grid { grid-template-columns: 1fr 1fr; } #editor .grid > div:nth-child(2) { grid-column: 1 / -1; grid-row: 2; } }
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1>Úkoly</h1>
  <div class="sync" id="sync"></div>
  <button class="icon" id="btn-refresh" title="Obnovit" aria-label="Obnovit" hidden>↻</button>
  <button class="icon" id="btn-logout" title="Odhlásit" aria-label="Odhlásit" hidden>⎋</button>
</header>

<main>
  <div id="banner" class="banner" hidden></div>

  <section id="login" hidden>
    <img src="icon-512.png" alt="">
    <h2 style="justify-content:center">Přihlášení</h2>
    <p>Aplikace čte a zapisuje úkoly ve složce <b>IMP sdílené</b> na Google Disku (stejné úkoly jako IMP a o-io). Vidí jen soubory této aplikace, ne zbytek Disku.</p>
    <button class="primary" id="btn-login">Přihlásit přes Google</button>
  </section>

  <section id="app" hidden>
    <div id="groups"></div>
    <details id="backlogbox" style="margin-top:8px">
      <summary><h2 style="margin-bottom:8px">Backlog <span id="backlog-count"></span></h2></summary>
      <div class="card" id="backlog"></div>
    </details>
    <details id="donebox" style="margin-top:8px">
      <summary><h2 style="margin-bottom:8px">Hotovo <span id="done-count"></span></h2></summary>
      <div class="card" id="done"></div>
      <p style="text-align:right"><button class="danger" id="btn-cleardone">Smazat všechny hotové</button></p>
    </details>
  </section>
</main>

<div class="addbar" id="addbar" hidden>
  <form id="addform" autocomplete="off">
    <input type="text" id="addtext" placeholder="Nový úkol…" enterkeyhint="done" aria-label="Nový úkol">
    <button class="primary" type="submit" aria-label="Přidat úkol">Přidat</button>
  </form>
</div>

<div id="editor" role="dialog" aria-label="Úkol">
  <h2 id="ed-head" style="margin:4px 0 0">Úkol</h2>
  <div><label class="cap" for="ed-title">Název</label>
    <input type="text" id="ed-title" placeholder="Název úkolu…" autocomplete="off"></div>
  <div class="grid">
    <div><label class="cap" for="ed-status">Stav</label><select id="ed-status"></select></div>
    <div><label class="cap" for="ed-project">Projekt</label>
      <input type="text" id="ed-project" list="projects" placeholder="bez projektu" autocomplete="off"><datalist id="projects"></datalist></div>
    <div><label class="cap" for="ed-priority">Priorita</label><select id="ed-priority"></select></div>
  </div>
  <div><label class="cap" for="ed-desc">Popis</label>
    <textarea id="ed-desc" placeholder="Volitelný popis…"></textarea></div>
  <div><label class="cap">Podúkoly</label>
    <div class="card" id="ed-subs"></div>
    <form id="ed-subform" autocomplete="off" style="display:flex;gap:8px;margin-top:8px">
      <input type="text" id="ed-subnew" placeholder="Přidat podúkol…" enterkeyhint="enter" aria-label="Nový podúkol">
      <button type="submit" aria-label="Přidat podúkol">+</button>
    </form></div>
  <div class="bar">
    <button id="ed-back">Zpět</button>
    <button class="danger" id="ed-delete">Smazat</button>
    <span class="spacer"></span>
    <button class="primary" id="ed-save">Uložit</button>
  </div>
</div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiReady && window.__gsiReady()"></script>
<script>
"use strict";
// Úkoly ze společného board.json (složka „IMP sdílené“) – stejný soubor a tvar úkolu jako IMP Master a o-io.
// Poznámky a skici v souboru zůstávají beze změny. Každá změna: přečíst čerstvý soubor, upravit jen dotčený úkol,
// ověřit, že ho mezitím nikdo nepřepsal (verze na Disku), zapsat.
const CFG = window.IMP_CONFIG || {};
const SCOPE = "https://www.googleapis.com/auth/drive.file";     // jen soubory aplikací tohoto projektu (IMP, o-io)
const FOLDER = "IMP sdílené", BOARD = "board.json", FORMAT = 1;
const STATUSES = ["backlog", "todo", "inprogress", "done"];
const STATUS_LABELS = { backlog: "Backlog", todo: "Todo", inprogress: "Rozpracované", done: "Hotovo" };
const PRIORITIES = ["high", "medium", "low"];
const PRIORITY_LABELS = { high: "Vysoká", medium: "Střední", low: "Nízká" };
const ID_RE = /^[A-Za-z0-9_]{1,64}$/;
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- stav
const S = { token: null, exp: 0, folderId: null, ids: {}, tasks: [], projects: [], editing: null, subs: [], busy: false, tokenClient: null, waiters: [] };

function newId() {                         // stejný tvar jako IMP a o-io: čas v base36 + 4 náhodné znaky
  const abc = "0123456789abcdefghijklmnopqrstuvwxyz", a = new Uint8Array(4); crypto.getRandomValues(a);
  return Date.now().toString(36) + Array.from(a, b => abc[b % 36]).join("");
}
function showBanner(text, info) { const b = $("banner"); b.textContent = text || ""; b.hidden = !text; b.className = "banner" + (info ? " info" : ""); }

// ---------------------------------------------------------------- přihlášení (Google Identity Services)
function saveToken() { try { sessionStorage.setItem("imp_tok", JSON.stringify({ t: S.token, e: S.exp, s: SCOPE })); } catch (_) {} }
function loadToken() {
  try { const o = JSON.parse(sessionStorage.getItem("imp_tok") || "null"); if (o && o.e > Date.now() && o.s === SCOPE) { S.token = o.t; S.exp = o.e; } } catch (_) {}
}
function clearToken() { S.token = null; S.exp = 0; try { sessionStorage.removeItem("imp_tok"); } catch (_) {} }

function initAuth() {
  if (S.tokenClient || !(window.google && google.accounts && google.accounts.oauth2)) return;
  S.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CFG.CLIENT_ID, scope: SCOPE,
    callback: resp => {
      const waiters = S.waiters.splice(0);
      if (resp.error || !resp.access_token) { waiters.forEach(w => w.reject(new Error(resp.error || "přihlášení se nezdařilo"))); return; }
      S.token = resp.access_token; S.exp = Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000; saveToken();
      waiters.forEach(w => w.resolve());
    },
    error_callback: err => { S.waiters.splice(0).forEach(w => w.reject(new Error((err && err.type) || "přihlášení zrušeno"))); },
  });
}
function requestToken(prompt) {
  return new Promise((resolve, reject) => {
    initAuth();
    if (!S.tokenClient) { reject(new Error("Přihlašovací služba Google se nenačetla (offline?).")); return; }
    S.waiters.push({ resolve, reject });
    S.tokenClient.requestAccessToken({ prompt });
  });
}
async function ensureToken() { if (S.token && Date.now() < S.exp) return; await requestToken(""); }

// ---------------------------------------------------------------- Drive
const API = "https://www.googleapis.com/drive/v3", UPLOAD = "https://www.googleapis.com/upload/drive/v3";
async function api(url, opts = {}, retry = true) {
  await ensureToken();
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + S.token } });
  if (r.status === 401 && retry) { clearToken(); return api(url, opts, false); }
  if (!r.ok) throw new Error(`Google Disk odpověděl chybou ${r.status}`);
  return r;
}
const q = s => s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
async function list(query) {
  const u = `${API}/files?spaces=drive&pageSize=10&orderBy=createdTime&fields=files(id,name)&q=` + encodeURIComponent(query);
  return (await (await api(u)).json()).files || [];
}
async function folderId() {
  if (S.folderId) return S.folderId;
  const f = await list(`name = '${q(FOLDER)}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false and 'root' in parents`);
  if (!f.length) throw new Error(`Na Disku není složka „${FOLDER}“. V IMPu zapni Google účty → Sdílení s o-io a synchronizuj.`);
  return (S.folderId = f[0].id);
}
async function boardId() {
  if (S.ids[BOARD]) return S.ids[BOARD];
  const f = await list(`name = '${q(BOARD)}' and '${await folderId()}' in parents and trashed = false`);
  if (!f.length) throw new Error("Ve složce „IMP sdílené“ zatím není board.json – nejdřív synchronizuj IMP.");
  return (S.ids[BOARD] = f[0].id);
}
async function version(id) { return (await (await api(`${API}/files/${id}?fields=version`)).json()).version; }

async function readBoard() {
  const id = await boardId();
  const ver = await version(id);                       // verze před obsahem: nanejvýš starší, nikdy novější
  const text = await (await api(`${API}/files/${id}?alt=media`)).text();
  let data;
  try { data = JSON.parse(text); } catch (_) { throw new Error("board.json na Disku je poškozený – nic neměním."); }
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("board.json na Disku má neznámý tvar – nic neměním.");
  if (Number(data.version || 1) > FORMAT) throw new Error("board.json má novější formát – aktualizuj IMP Mobile.");
  if (!Array.isArray(data.tasks)) data.tasks = [];
  return { id, ver, data };
}
function useBoard(data) {
  S.tasks = data.tasks.filter(t => t && typeof t === "object" && ID_RE.test(String(t.id || "")));
  const names = new Set();
  [...S.tasks, ...(Array.isArray(data.notes) ? data.notes : [])].forEach(x => { const p = String((x && x.project) || "").trim(); if (p) names.add(p); });
  S.projects = [...names].sort((a, b) => a.localeCompare(b, "cs"));
}
async function loadAll() { useBoard((await readBoard()).data); }

// fn(tasks) upraví pole na místě a vrátí true, když se něco změnilo
async function mutate(fn) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const { id, ver, data } = await readBoard();
    if (!fn(data.tasks)) { useBoard(data); return; }
    if ((await version(id)) !== ver) continue;         // mezitím zapsal IMP nebo o-io – znovu nad čerstvými daty
    await api(`${UPLOAD}/files/${id}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": "application/json; charset=UTF-8" },
      body: JSON.stringify(data, null, 1) });
    useBoard(data);
    return;
  }
  throw new Error("Soubor se právě mění na jiném zařízení – zkus to za chvíli znovu.");
}
const now = () => Date.now();
const findTask = (tasks, id) => tasks.find(t => t && t.id === id);

// ---------------------------------------------------------------- vykreslení
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k === "class" ? (e.className = v) : k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  kids.forEach(k => e.append(k)); return e;
}
const PRI_ORDER = { high: 0, medium: 1, low: 2 };
function render() {
  const by = s => S.tasks.filter(t => (STATUSES.includes(t.status) ? t.status : "todo") === s);
  const sortP = arr => arr.slice().sort((a, b) => (PRI_ORDER[a.priority] ?? 1) - (PRI_ORDER[b.priority] ?? 1));
  const groups = $("groups"); groups.replaceChildren();
  [["inprogress", "Rozpracované"], ["todo", "Todo"]].forEach(([s, label]) => {
    const items = sortP(by(s));
    if (s === "inprogress" && !items.length) return;
    const card = el("div", { class: "card" });
    if (!items.length) card.append(el("div", { class: "empty" }, "Žádné úkoly. Podezřele klidné."));
    items.forEach(t => card.append(taskRow(t)));
    groups.append(el("h2", {}, label + (items.length ? ` (${items.length})` : "")), card);
  });
  fill("backlog", sortP(by("backlog")), "backlog-count");
  fill("done", by("done"), "done-count");
}
function fill(boxId, items, countId) {
  const box = $(boxId); box.replaceChildren();
  if (!items.length) box.append(el("div", { class: "empty" }, "Nic."));
  items.forEach(t => box.append(taskRow(t)));
  $(countId).textContent = items.length ? `(${items.length})` : "";
}
function taskRow(t) {
  const done = t.status === "done";
  const cb = el("input", { type: "checkbox", "aria-label": String(t.title || ""), onclick: e => e.stopPropagation(),
    onchange: () => act(() => mutate(tasks => { const x = findTask(tasks, t.id); if (!x) return false;
      x.status = x.status === "done" ? "todo" : "done"; x.updated = now(); return true; })) });
  cb.checked = done;
  const meta = el("span", { class: "meta" });
  if (t.priority === "high" || t.priority === "low") meta.append(el("span", { class: "badge " + t.priority }, PRIORITY_LABELS[t.priority]));
  if (t.project) meta.append(el("span", { class: "badge proj" }, String(t.project)));
  const subs = Array.isArray(t.subtasks) ? t.subtasks.filter(s => s && typeof s === "object") : [];
  if (subs.length) meta.append(el("span", { class: "badge" }, `${subs.filter(s => s.done).length}/${subs.length}`));
  const label = el("div", { class: "label" }, String(t.title || "(bez názvu)"));
  if (meta.childNodes.length) label.append(meta);
  return el("div", { class: "row task" + (done ? " done" : ""), onclick: () => openEditor(t.id) }, cb, label);
}

// ---------------------------------------------------------------- akce
async function act(fn) {
  if (S.busy) return;
  S.busy = true; showBanner("");
  try { await fn(); render(); stamp(); }
  catch (e) { showBanner(e.message || String(e)); try { await loadAll(); render(); } catch (_) {} }
  finally { S.busy = false; }
}
function stamp() { const d = new Date(); $("sync").textContent = "synchronizováno " + d.toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }); }
async function refresh(quiet) {
  if (S.busy) return;
  S.busy = true;
  try { if (!quiet) showBanner(""); await loadAll(); render(); stamp(); }
  catch (e) { if (!quiet) showBanner(e.message || String(e)); }
  finally { S.busy = false; }
}

// ---------------------------------------------------------------- editor úkolu (stejná pole jako IMP)
STATUSES.forEach(s => $("ed-status").append(el("option", { value: s }, STATUS_LABELS[s])));
PRIORITIES.forEach(p => $("ed-priority").append(el("option", { value: p }, PRIORITY_LABELS[p])));

function openEditor(id) {
  const t = id ? findTask(S.tasks, id) : null;
  S.editing = t ? t.id : "";
  $("ed-head").textContent = t ? "Upravit úkol" : "Nový úkol";
  $("ed-title").value = t ? String(t.title || "") : "";
  $("ed-status").value = t && STATUSES.includes(t.status) ? t.status : "todo";
  $("ed-priority").value = t && PRIORITIES.includes(t.priority) ? t.priority : "medium";
  $("ed-project").value = t ? String(t.project || "") : "";
  $("ed-desc").value = t ? String(t.description || "") : "";
  S.subs = (t && Array.isArray(t.subtasks) ? t.subtasks : []).filter(s => s && typeof s === "object")
    .map(s => ({ title: String(s.title || ""), done: !!s.done }));
  $("projects").replaceChildren(...S.projects.map(p => el("option", { value: p })));
  renderSubs();
  $("ed-delete").hidden = !t; $("editor").classList.add("open");
  if (!t) $("ed-title").focus();
}
function renderSubs() {
  const box = $("ed-subs"); box.replaceChildren();
  if (!S.subs.length) box.append(el("div", { class: "empty" }, "Žádné podúkoly."));
  S.subs.forEach((s, i) => {
    const cb = el("input", { type: "checkbox", "aria-label": s.title, onchange: () => { S.subs[i].done = cb.checked; renderSubs(); } });
    cb.checked = s.done;
    box.append(el("div", { class: "row" + (s.done ? " done" : "") }, cb, el("div", { class: "label" }, s.title),
      el("button", { class: "icon danger", type: "button", "aria-label": "Odebrat podúkol", onclick: () => { S.subs.splice(i, 1); renderSubs(); } }, "✕")));
  });
}
function closeEditor() { $("editor").classList.remove("open"); S.editing = null; }
async function saveEditor() {
  if (S.editing === null) return;
  const pending = $("ed-subnew").value.trim();
  if (pending) { S.subs.push({ title: pending, done: false }); $("ed-subnew").value = ""; }
  const id = S.editing, old = id && findTask(S.tasks, id);
  const title = $("ed-title").value.trim() || (old ? String(old.title || "") : "");
  if (!title) { closeEditor(); return; }                 // prázdný nový úkol se neuloží
  const fields = { title, status: $("ed-status").value, priority: $("ed-priority").value, project: $("ed-project").value.trim(),
    description: $("ed-desc").value, subtasks: S.subs.map(s => ({ title: s.title, done: s.done })) };
  closeEditor();
  await act(() => mutate(tasks => {
    const x = id && findTask(tasks, id);
    if (x) {
      const changed = Object.keys(fields).some(k => JSON.stringify(x[k] ?? (k === "subtasks" ? [] : "")) !== JSON.stringify(fields[k]));
      if (!changed) return false;
      Object.assign(x, fields, { updated: now() });
      return true;
    }
    // nový úkol (nebo úkol mezitím smazaný jinde – úprava má přednost před smazáním, stejně jako v IMPu)
    tasks.unshift({ id: id || newId(), ...fields, due: "", updated: now() });
    return true;
  }));
}
async function deleteTask() {
  const id = S.editing;
  const t = id && findTask(S.tasks, id);
  if (!t || !confirm(`Smazat úkol „${t.title}“?`)) return;
  closeEditor();
  await act(() => mutate(tasks => { const i = tasks.findIndex(x => x && x.id === id); if (i < 0) return false; tasks.splice(i, 1); return true; }));
}

// ---------------------------------------------------------------- start
function showLogin(msg) {
  $("login").hidden = false; $("app").hidden = true; $("addbar").hidden = true;
  $("btn-refresh").hidden = $("btn-logout").hidden = true; $("sync").textContent = ""; showBanner(msg || "", false);
}
async function start() {
  if (!CFG.CLIENT_ID || CFG.CLIENT_ID.startsWith("VLOZ")) { showLogin("Chybí ID klienta Google v souboru config.js (viz README)."); $("btn-login").disabled = true; return; }
  $("login").hidden = true; $("app").hidden = false; $("addbar").hidden = false;
  $("btn-refresh").hidden = $("btn-logout").hidden = false;
  try { await ensureToken(); }
  catch (e) { showLogin(""); return; }
  try { await loadAll(); render(); stamp(); }
  catch (e) { render(); showBanner(e.message || String(e)); }
}
$("btn-login").onclick = async () => {
  try { await requestToken("select_account"); await start(); } catch (e) { showBanner("Přihlášení se nezdařilo: " + (e.message || e)); }
};
$("btn-logout").onclick = () => { if (S.token && window.google) google.accounts.oauth2.revoke(S.token, () => {}); clearToken(); S.ids = {}; S.folderId = null; showLogin(); };
$("btn-refresh").onclick = () => refresh(false);
$("btn-cleardone").onclick = () => confirm("Smazat všechny hotové úkoly?") && act(() => mutate(tasks => {
  const before = tasks.length;
  for (let i = tasks.length - 1; i >= 0; i--) if (tasks[i] && tasks[i].status === "done") tasks.splice(i, 1);
  return tasks.length !== before;
}));
$("addform").onsubmit = ev => {
  ev.preventDefault();
  const title = $("addtext").value.trim();
  if (!title) return;
  $("addtext").value = "";
  act(() => mutate(tasks => { tasks.unshift({ id: newId(), title, status: "todo", project: "", priority: "medium", description: "",
    subtasks: [], due: "", updated: now() }); return true; }));
};
$("ed-subform").onsubmit = ev => {
  ev.preventDefault();
  const v = $("ed-subnew").value.trim();
  if (!v) return;
  S.subs.push({ title: v, done: false }); $("ed-subnew").value = ""; renderSubs();
};
$("ed-save").onclick = saveEditor; $("ed-back").onclick = saveEditor; $("ed-delete").onclick = deleteTask;
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.editing !== null) saveEditor(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.token && S.editing === null) refresh(true); });
setInterval(() => { if (!document.hidden && S.token && S.editing === null) refresh(true); }, 60000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
loadToken();
window.__gsiReady = () => { initAuth(); if (S.token) start(); else showLogin(); };
if (window.google && google.accounts) window.__gsiReady();
else if (S.token) start(); else showLogin();
</script>
</body>
